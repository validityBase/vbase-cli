name: Python Dependency Locks

on:
  pull_request:
    paths:
      - "requirements*.in"
      - "requirements*.txt"
      - "docs/requirements*.in"
      - "docs/requirements*.txt"
      - "setup.py"
      - "MANIFEST.in"
      - "internal/specs/python-dependency-hashes.md"
      - ".github/workflows/python-dependency-locks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-locks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout v5.0.1

      - name: Install lock tooling
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements-lock.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Regenerate dependency locks
        run: |
          python -m piptools compile --strip-extras --no-annotate --generate-hashes -o requirements.txt requirements.in
          python -m piptools compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements-dev.txt requirements-dev.in
          python -m piptools compile --strip-extras --no-annotate --generate-hashes -o docs/requirements.txt docs/requirements.in
          python -m piptools compile --strip-extras --no-annotate --allow-unsafe --generate-hashes -o requirements-lock.txt requirements-lock.in

      - name: Verify generated lock files are current
        run: git diff --exit-code -- requirements.txt requirements-dev.txt requirements-lock.txt docs/requirements.txt

      - name: Install development dependencies
        uses: validityBase/vbase-github-actions/.github/actions/setup-python-deps@v1
        with:
          requirements-files: |
            requirements-dev.txt
          python-version: "3.11"
          require-hashes: "true"

      - name: Install package metadata
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Check installed dependencies
        run: python -m pip check
