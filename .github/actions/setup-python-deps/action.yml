name: Setup Python dependencies
description: >
  Cache pip and install requirements. The cache key uses the Python major.minor
  string plus hashes of requirements files. Optional docs/ and dev extras.
inputs:
  install-docs-first:
    description: If true, install docs/requirements.txt before requirements.txt
    required: false
    default: "false"
  install-dev-deps:
    description: If true, install requirements-dev.txt after requirements.txt
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Determine Python version
      id: python-version
      shell: bash
      run: |
        echo "version=$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" >> "$GITHUB_OUTPUT"

    - name: Cache pip
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ steps.python-version.outputs.version }}-${{ hashFiles('requirements.txt', 'docs/requirements.txt', 'requirements-dev.txt') }}-v2
        restore-keys: |
          ${{ runner.os }}-pip-${{ steps.python-version.outputs.version }}-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-docs-first }}" = "true" ]; then
          python -m pip install -r docs/requirements.txt
        fi
        python -m pip install -r requirements.txt
        if [ "${{ inputs.install-dev-deps }}" = "true" ]; then
          python -m pip install -r requirements-dev.txt
        fi
