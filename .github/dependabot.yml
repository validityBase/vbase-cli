version: 2
updates:
  - package-ecosystem: "pip"
    # Dependabot can scan pip-compile layouts when each directory contains both
    # requirements*.in inputs and requirements*.txt outputs.
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC"
    versioning-strategy: "increase-if-necessary"
    groups:
      pip-version-updates:
        # Do not set group-by: dependency-name; this group intentionally batches
        # all version updates instead of opening one PR per dependency.
        applies-to: "version-updates"
        patterns:
          - "*"
      pip-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
