version: 2
updates:
  - package-ecosystem: "pip"
    # Dependabot scans pip-compile layouts when each directory contains both
    # requirements*.in inputs and requirements*.txt outputs.
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC"
    versioning-strategy: "increase-if-necessary"
    groups:
      pip-root-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      pip-root-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "pip"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "pip"
    # Dependabot scans pip-compile layouts when each directory contains both
    # requirements*.in inputs and requirements*.txt outputs.
    directory: "/docs"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Etc/UTC"
    versioning-strategy: "increase-if-necessary"
    groups:
      pip-docs-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
      pip-docs-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      - dependency-name: "pip"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
